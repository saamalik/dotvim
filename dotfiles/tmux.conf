# ~/.tmux.conf

# Prefix C-a (C-a a sends a literal C-a)
set -g prefix C-a
unbind-key C-b
bind-key a send-prefix

bind-key r source-file ~/.tmux.conf \; display "Reloaded!"

# Terminal. tmux-256color ships with macOS 14+. tmux only grants true colour to
# outer terminals it knows about, so declare it for the ones in use (Ghostty sets
# TERM=xterm-ghostty). Drop the RGB line for Terminal.app, which has none.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB,xterm-ghostty:RGB"
set -s escape-time 0
set -g focus-events on
set -g history-limit 50000
set -g mouse on
set -g set-titles on
set -g set-titles-string "#S > #W"

# Windows and panes count from 1 and renumber when one closes
set -g base-index 1
set -w -g pane-base-index 1
set -g renumber-windows on
set -w -g aggressive-resize on

# Splits, movement, resizing
bind-key | split-window -h
bind-key - split-window -v
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
bind-key -r C-h select-window -t :-
bind-key -r C-l select-window -t :+
bind-key C-p last-window
bind-key -r H resize-pane -L 5
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r L resize-pane -R 5

# Copy mode: vi keys, Escape to enter, y copies to the macOS clipboard
set -w -g mode-keys vi
set -s copy-command pbcopy
unbind-key [
bind-key Escape copy-mode
bind-key p paste-buffer
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi C-v send -X rectangle-toggle
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel

# Toggles: synchronize panes, silence monitoring, logging a window to a file
bind-key C-s set-option -w synchronize-panes
bind-key C-f set -w monitor-activity off \; set -w monitor-silence 20 \; display "Silence monitoring started!"
bind-key C-d set -w monitor-activity on \; set -w monitor-silence 0 \; display "Silence monitoring disabled!"
bind-key P pipe-pane -o "cat >>~/#W.log" \; display "Toggled logging to ~/#W.log"

# Activity alerts
set -w -g monitor-activity on
set -g visual-activity on
set -g visual-silence on

# Status line: kube context (install.sh clones kube-tmux) and the clock
set -g status-style fg=white,bg=colour238
set -w -g window-status-style fg=cyan,bg=default
set -w -g window-status-current-style fg=white,bg=red,bright
set -g message-style fg=white,bg=default,bright,italics
set -g status-justify centre
set -g status-interval 60
set -g status-left-length 20
set -g status-left "#[fg=green]Session: #S #[fg=yellow]#I #[fg=cyan]#P"
set -g status-right-length 40
set -g status-right "#(KUBE_TMUX_NS_ENABLE=false /bin/bash $HOME/.tmux/kube-tmux/kube.tmux 250 yellow green) #[fg=cyan]| %b %d %R"
